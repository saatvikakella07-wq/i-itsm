# =============================================================================
# I-ITSM Application Configuration
# =============================================================================
server.port=8081
spring.application.name=i-itsm-backend

# -----------------------------------------------------------------------------
# Datasource Configuration (PostgreSQL by default)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/itsm_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# -----------------------------------------------------------------------------
# Security & JWT Configuration
# -----------------------------------------------------------------------------
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expirationMs=86400000

# Task Scheduling for SLA Monitor and Auto-Escalation
spring.task.scheduling.pool.size=4

# Logging
logging.level.com.itsm=INFO
logging.level.org.springframework.web=INFO
